# SSASpawnerAntiESP — hides SmartSpawner block positions without line of sight (RTAX-style chunk obfuscation + ray trace).

settings:
  update-ticks: 1
  ms-per-ray-trace-tick: 50
  ray-trace-threads: 1

world-settings:
  default:
    enabled: true
    ray-trace-distance: 64.0
    ray-trace-third-person: false
    rehide-blocks: true
    rehide-distance: 60.0
    section-leap: false
    max-ray-trace-block-count-per-chunk: 64
