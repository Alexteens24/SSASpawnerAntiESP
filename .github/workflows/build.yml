name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_JAVA_VERSION: "25"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.CI_JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.CI_JAVA_VERSION }}
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build universal JAR
        run: ./gradlew shadowJar --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p ci-out
          shopt -s nullglob
          for f in build/libs/SSASpawnerAntiESP-*.jar; do
            case "$f" in
              *-plain.jar|*-sources.jar|*-javadoc.jar) continue ;;
            esac
            cp "$f" ci-out/
          done
          test "$(find ci-out -name '*.jar' | wc -l)" -ge 1

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: SSASpawnerAntiESP-${{ github.sha }}
          path: ci-out/*.jar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: SSASpawnerAntiESP-${{ github.sha }}
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.jar
          generate_release_notes: true
